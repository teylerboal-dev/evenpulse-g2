<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>EvenPulse v2.0 — Multi-Exchange &amp; Voice HUD for Even G2</title>
    <style>
      :root {
        --bg: #0f131a;
        --card: #171d28;
        --border: #273043;
        --text: #e8ecf4;
        --muted: #8b95a8;
        --g2-bg: #06120a;
        --g2-green: #39ff85;
        --g2-dim: #188a42;
        --accent: #38bdf8;
        --danger: #f87171;
        --ok: #34d399;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
      }
      .wrap {
        max-width: 780px;
        margin: 0 auto;
        padding: 18px 16px 36px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
        flex-wrap: wrap;
      }
      h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
      .subtitle { font-size: 12px; color: var(--muted); }
      .pills { display: flex; gap: 6px; flex-wrap: wrap; }
      .pill {
        font-size: 11px;
        padding: 3px 8px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--muted);
      }
      .pill.ok { color: var(--ok); border-color: rgba(52, 211, 153, 0.35); }
      .pill.err { color: var(--danger); border-color: rgba(248, 113, 113, 0.35); }

      /* Authentic 576x288 G2 Monochrome Green Lens Mirror */
      .g2-frame {
        background: #040906;
        border: 2px solid #1e3f2a;
        border-radius: 14px;
        padding: 14px 16px 10px;
        box-shadow: 0 0 32px rgba(57, 255, 133, 0.09), inset 0 0 28px rgba(57, 255, 133, 0.05);
        margin-bottom: 14px;
        transition: background 0.25s ease;
      }
      .g2-frame.ar-optical {
        background:
          radial-gradient(circle at 50% 42%, rgba(57, 255, 133, 0.14), rgba(14, 24, 34, 0.72) 68%),
          linear-gradient(135deg, #1b2430 0%, #243242 45%, #16202b 100%);
        border-color: rgba(57, 255, 133, 0.45);
      }
      .g2-frame.ar-optical .g2-screen {
        background: rgba(6, 18, 10, 0.56);
        backdrop-filter: blur(2px);
      }
      .g2-meta {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        flex-wrap: wrap;
        font-size: 11px;
        color: var(--g2-dim);
        margin-bottom: 6px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .g2-screen {
        background: var(--g2-bg);
        border: 1px solid #153c23;
        border-radius: 8px;
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .g2-body {
        margin: 0;
        color: var(--g2-green);
        font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        white-space: pre-wrap;
        word-break: break-word;
        text-shadow: 0 0 6px rgba(57, 255, 133, 0.35);
        min-height: 112px;
      }
      .g2-mid {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        border-top: 1px dashed #143d22;
        padding-top: 8px;
      }
      .g2-status {
        margin: 0;
        color: #27da6a;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        white-space: pre-wrap;
        flex: 1;
        min-width: 220px;
      }
      .g2-canvas {
        width: 200px;
        height: 96px;
        border-radius: 4px;
        image-rendering: pixelated;
        box-shadow: 0 0 12px rgba(57, 255, 133, 0.16);
      }
      .g2-footer {
        padding-top: 6px;
        border-top: 1px dashed #174928;
        color: #1fc95f;
        font: 11px/1.3 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .controls, .controls-tight {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(126px, 1fr));
        gap: 8px;
        margin-bottom: 12px;
      }
      button {
        appearance: none;
        background: var(--card);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 9px 11px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: border-color 0.15s, background 0.15s;
      }
      button:hover { border-color: var(--accent); background: #222a3a; }
      button.primary {
        background: #123c24;
        border-color: #22c55e;
        color: #bbf7d0;
      }
      button.primary:hover { background: #164e2e; }
      button.danger-btn {
        background: #44161a;
        border-color: #f87171;
        color: #fecaca;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 16px;
        margin-bottom: 12px;
      }
      .card h2 { font-size: 14px; margin: 0 0 10px; color: var(--text); }
      .voice-row {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }
      .voice-row input {
        flex: 1;
        background: #101520;
        border: 1px solid var(--border);
        border-radius: 9px;
        color: var(--text);
        padding: 8px 11px;
        font-size: 13px;
      }
      .preset-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chip {
        font-size: 12px;
        padding: 5px 9px;
        border-radius: 999px;
        background: #121722;
      }
      .grid-2 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 10px;
      }
      .stat {
        background: #121722;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
      }
      .stat .label { font-size: 11px; color: var(--muted); }
      .stat .val { font-size: 16px; font-weight: 600; margin-top: 2px; }
      .pos { color: var(--ok); }
      .neg { color: var(--danger); }
      .muted { color: var(--muted); font-size: 12px; }
      .audit-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font: 12px/1.6 ui-monospace, Menlo, Consolas, monospace;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        padding: 3px 0;
      }
      footer.note {
        font-size: 11px;
        color: var(--muted);
        text-align: center;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
